name: 汉化工程检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: 文本、JSON 与工具链检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install ndspy Pillow fonttools
      - name: Validate JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8-sig'))
              print('OK', path)
          PY
      - name: Compile Python tools
        run: python -m compileall -q tools
      - name: Lint checked-in translations
        run: python tools/translation_lint.py data/text/translations_appended10.json --source data/text/messages_jp.json --json-report /tmp/translation-lint.json
      - name: Reject game and save artifacts
        shell: bash
        run: |
          if find . -type f \
            \( -iname '*.nds' -o -iname '*.dsv' -o -iname '*.dst' -o -iname '*.sav' -o -iname '*.zip' \) \
            -not -path './.git/*' | grep -q .; then
            echo 'ROM/save/release archive found in repository'
            exit 1
          fi
